# Rime schema - 麓鸣·纯形·用户词表（仅构建用，不进输入法选单）
# 作用：让 rime_deployer 把 yoyo-user.dict.yaml 编译成 yoyo-user.table.bin，
#       供 yoyo-pure / yoyo-pure-km 通过 translator/import_tables 在运行时加载。
# 注意：本 schema 故意不注册进 default.custom.yaml 的 schema_list，因此不会
#       出现在输入法选单里，只用于构建用户词表二进制。
schema:
  author:
    - Rayalizing
  description: |
    麓鸣纯形用户词表（构建专用）。由 yoyo-km-tui 写入。
  name: "麓鸣·纯形·用户词（构建）"
  schema_id: yoyo-user
  version: 1.0

#=============================== 
心法:
  __include: 纯形统一心法
指法:
  __include: yoyo:/六脉神剑
#=============================== 

__include: yoyo:/
__patch:
  translator/dictionary: yoyo-user
  translator/prism: yoyo-user

  engine/processors:
    - ascii_composer
    - lua_processor@*yoyo.reverse_lookup_bypass
    - chord_composer
    - lua_processor@*yoyo.pure_popping
    - lua_processor@*yoyo.commit_raw
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  engine/filters:
    - lua_filter@*yoyo.priority_filter
    - uniquifier
    - simplifier

  chord_composer:
    alphabet: "12345qwertasdfgzxcvb 67890yuiophjkl;nm,./'"
    prompt_format:
      - xform/[-=_+]//g
    output_format:
      - xform|^[-=_+]([0-9]+)$|$1|
    algebra:
      __patch:
        - 心法
        - 指法

  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Control_L: clear
      Control_R: clear
      Shift_L: noop
      Shift_R: noop
      Caps_Lock: clear
      Eisu_toggle: clear

  speller:
    alphabet: "zyxwvutsrqponmlkjihgfedcba;,./ZYXWVUTSRQPONMLKJIHGFEDCBA:<>?_+'0123456789"
    initials: "zyxwvutsrqponmlkjihgfedcba;,./ZYXWVUTSRQPONMLKJIHGFEDCBA:<>?_+'0123456789"
    auto_select: false
    algebra:
      - derive|^([a-zA-Z;:,<.>/?]{2})([a-zA-Z;:,<.>/?])$|$1_$2|
      - derive|^([a-zA-Z;:,<.>/?]{2})([a-zA-Z;:,<.>/?])$|$1+$2|
      - derive|^([a-zA-Z;:,<.>/?]{2})([a-zA-Z;:,<.>/?]{2})$|$1_$2|
      - derive|^([a-zA-Z;:,<.>/?]{2})([a-zA-Z;:,<.>/?]{2})$|$1+$2|
      - derive|^([a-zA-Z;:,<.>/?]{3})([a-zA-Z;:,<.>/?])$|$1_$2|
      - derive|^([a-zA-Z;:,<.>/?]{3})([a-zA-Z;:,<.>/?])$|$1+$2|

纯形统一心法:
  __append:
    - xform|^([12345qwertasdfgzxcvb]+)([67890yuiophjkl;nm,./]+)([']?)$|$1#$2$3|
    - xform|^([12345qwertasdfgzxcvb]+)([']?)$|_$1$2|
    - xform|^([67890yuiophjkl;nm,./]+)([']?)$|+$1$2|
