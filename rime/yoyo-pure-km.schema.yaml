# Rime schema - 麓鸣·纯形·空明 (yoyo-pure-km)
schema:
  author:
    - Rayalizing
  description: |
    麓鸣纯形统一流（空明拳指法），基于上下文感知状态机（FSM）消除并击空格，
    6638字【零重码】、单字3码与词语4码无缝混打、0空格一击顶功。
  name: "麓鸣·纯形·空明"
  schema_id: yoyo-pure-km
  version: 1.0

#=============================== 
心法:
  __include: 纯形统一心法
指法:
  __include: yoyo:/空明拳
#=============================== 

__include: yoyo:/
__patch:
  translator/dictionary: yoyo-pure
  translator/prism: yoyo-pure-km
  # 用户加词表（由 yoyo-km-tui 写入）。yoyo-user 通过 build-only schema
  # (yoyo-user.schema.yaml) 被 rime_deployer 编译成 yoyo-user.table.bin，
  # 这里在运行时把它加载进翻译器；不被 generate_pure_dict.py 覆盖。
  translator/import_tables: [yoyo-user]

  switches:
    - name: ascii_mode
      states: [ 中文, 西文 ]
    - name: full_shape
      states: [ 半角, 全角 ]
    - name: simplification
    - name: ascii_punct
      states: [ 。，, ．， ]
    - name: instant_commit_3code
      states: [ 顶屏, 直出 ]
      reset: 0
    - name: word_priority
      states: [ 主单, 主词 ]
      reset: 0

  engine/processors:
    - ascii_composer
    - lua_processor@*yoyo.reverse_lookup_bypass
    - chord_composer
    - lua_processor@*yoyo.km_punct
    - lua_processor@*yoyo.pure_popping
    - lua_processor@*yoyo.commit_raw
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  engine/filters:
    - lua_filter@*yoyo.priority_filter
    - uniquifier
    - simplifier

  key_binder/+:
    bindings:
      - { when: composing, accept: BackSpace, send: Escape }
      - { when: composing, accept: Return, send: Escape }
      - { accept: "Control+Shift+C", toggle: word_priority, when: always }

  chord_composer:
    alphabet: "qwertasdfgzxcvb yuiophjkl;nm,./:'"
    prompt_format:
      - xform/[-=_+]//g
    output_format:
      - xform|^[-=_+]([0-9]+)$|$1|
    algebra:
      __patch:
        - 心法
        - 指法

  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Control_L: clear
      Control_R: clear
      Shift_L: noop
      Shift_R: noop
      Caps_Lock: clear
      Eisu_toggle: clear

  speller:
    # % 为「空格并击简词」标记（见纯形统一心法三条空格规则）
    alphabet: "zyxwvutsrqponmlkjihgfedcba;,./%ZYXWVUTSRQPONMLKJIHGFEDCBA:<>?_+'"
    initials: "zyxwvutsrqponmlkjihgfedcba;,./%ZYXWVUTSRQPONMLKJIHGFEDCBA:<>?_+'"
    auto_select: false
    algebra:
      # 将字典中 3 码单字 (如 bXn, wCs) 派生出单手击键输入形式 (如 bX_n, wC+s)
      - derive|^([a-zA-Z;:,<.>/?]{2})([a-zA-Z;:,<.>/?])$|$1_$2|
      - derive|^([a-zA-Z;:,<.>/?]{2})([a-zA-Z;:,<.>/?])$|$1+$2|
      # 将字典中 4 码词 (如 xkhr) 派生出第3/4码单手击键输入形式
      - derive|^([a-zA-Z;:,<.>/?]{2})([a-zA-Z;:,<.>/?]{2})$|$1_$2|
      - derive|^([a-zA-Z;:,<.>/?]{2})([a-zA-Z;:,<.>/?]{2})$|$1+$2|
      - derive|^([a-zA-Z;:,<.>/?]{3})([a-zA-Z;:,<.>/?])$|$1_$2|
      - derive|^([a-zA-Z;:,<.>/?]{3})([a-zA-Z;:,<.>/?])$|$1+$2|

纯形统一心法:
  __append:
    # ── 空格并击简词（一击上屏）──
    # 空格在 alphabet 中下标 15，位于左右手键区之间：
    #   双手+空格 → 输出 "左 右"    → %左#右（# 由指法末尾的 xform|#|| 清除）
    #   左手+空格 → 输出 "左 "      → %_X
    #   右手+空格 → 输出 " 右"（右手键排在空格之后，故空格在前）→ %+X
    - xform|^([qwertasdfgzxcvb]+) ([yuiophjkl;nm,./:]+)$|%$1#$2|
    - xform|^([qwertasdfgzxcvb]+) $|%_$1|
    - xform|^ ([yuiophjkl;nm,./:]+)$|%+$1|
    # 左右手并击：以 # 分隔左右两手按键区，保留末尾可能存在的 ' 次选修饰符
    - xform|^([qwertasdfgzxcvb]+)([yuiophjkl;nm,./:]+)([']?)$|$1#$2$3|
    # 单手按键：转换为 _ (左手) 或 + (右手) 开头的一简前缀，保留末尾可能存在的 ' 次选修饰符
    - xform|^([qwertasdfgzxcvb]+)([']?)$|_$1$2|
    - xform|^([yuiophjkl;nm,./:]+)([']?)$|+$1$2|
