# 多字词编码规则配置
# 公式说明：
#   A, B, C... 表示第1, 2, 3...个字
#   Z 表示最后一个字，Y 表示倒数第二个字
#   a, b, c... 表示编码的第1, 2, 3...个字符
#   z 表示编码的最后一个字符，y 表示倒数第二个字符
# 例如：AaBa 表示取第一个字的第1码和第二个字的第1码

多字词规则:
  - 2字词: AaAbBaBbBcBdBeBfAcAdAeAf
  - 3字词: AaAbBaBbCaCbCcCdCeCfAcAd
  - 4字词: AaAbBaBbCaCbDaDbDcDdDeDf
  - 5字词: AaAbBaBbCaCbDaDbEaEbEcEd
  - 6到100字词: AaAbBaBbCaCbDaDbEaEbZaZb
  # - 2字词: AaAbBaBbBcBdBeBfAcAdAeAf
  # # - 2字词: AaAbBaBbAcAdBcBd
  # - 3字词: AaAbBaBbCaCbCcCd
  # - 4到100字词: AaAbBaBbCaCbDaDb
简码设定:
  # # 词长度 = 2:
  # - 词长: 2
  #   出简配置:
  #     - 码长: 2  # 表示码长为2的简码（二码简码）
  #       数量: 2   # 表示该类简码设为2个
  #     - 码长: 4
  #       数量: 1
  #     - 码长: 8
  #       数量: 1
  # # 词长度 = 3
  # - 词长: 3
  #   出简配置:
  #     - 码长: 6
  #       数量: 1   # 六码简码设1个

  # 词长度范围：2 ~ 99（范围内所有词长共享下方配额，不按词长各自重复）
  - 词长范围:
      最小值: 2
      最大值: 99
    出简配置: 
      - 码长: 2  # 二码简码：同一前缀在整段词长范围内最多出 2 个
        数量: 2
      - 码长: 4  # 四码简码：同一前缀最多出 1 个
        数量: 1
      - 码长: 8
        数量: 1
