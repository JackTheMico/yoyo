# Rime schema - 麓鸣·纯形·六脉 (yoyo-pure)
schema:
  author:
    - Rayalizing
  description: |
    麓鸣纯形统一流（六脉神剑指法），基于上下文感知状态机（FSM）消除并击空格，
    6638字【零重码】、单字3码与词语4码无缝混打、0空格一击顶功。
  name: "麓鸣·纯形·六脉"
  schema_id: yoyo-pure
  version: 1.0

#=============================== 
心法:
  __include: 纯形统一心法
指法:
  __include: yoyo:/六脉神剑
#=============================== 

__include: yoyo:/
__patch:
  translator/dictionary: yoyo-pure
  translator/prism: yoyo-pure
  
  switches:
    - name: ascii_mode
      states: [ 中文, 西文 ]
    - name: full_shape
      states: [ 半角, 全角 ]
    - name: simplification
    - name: ascii_punct
      states: [ 。，, ．， ]
    - name: instant_commit_3code
      states: [ 顶屏, 直出 ]
      reset: 0

  engine/processors:
    - ascii_composer
    - lua_processor@*yoyo.reverse_lookup_bypass
    - chord_composer
    - lua_processor@*yoyo.pure_popping
    - lua_processor@*yoyo.commit_raw
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  chord_composer:
    alphabet: "12345qwertasdfgzxcvb 67890yuiophjkl;nm,./"
    prompt_format:
      - xform/[-=_+]//g
    output_format:
      - xform|^[-=_+]([0-9]+)$|$1|
    algebra:
      __patch:
        - 心法
        - 指法

  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Control_L: clear
      Control_R: clear
      Shift_L: noop
      Shift_R: noop
      Caps_Lock: clear
      Eisu_toggle: clear

  speller:
    alphabet: "zyxwvutsrqponmlkjihgfedcba;,./ZYXWVUTSRQPONMLKJIHGFEDCBA:<>?_+'0123456789"
    initials: "zyxwvutsrqponmlkjihgfedcba;,./ZYXWVUTSRQPONMLKJIHGFEDCBA:<>?_+'0123456789"
    auto_select: true
    auto_select_pattern: "'.+|(e?[6L]|fg).+"
    algebra:
      # 当单手击键作为第3码（带 _ 或 + 前缀）时，允许与前两码拼接匹配 3 码单字
      - derive|^([a-zA-Z;:,<.>/?]{2})[_+]([a-zA-Z;:,<.>/?])$|$1$2|

纯形统一心法:
  __append:
    # 左右手并击：以单引号分隔左右两手按键区，交由指法映射转换为纯码元
    - xform|^([12345qwertasdfgzxcvb]+)([67890yuiophjkl;nm,./]+)$|$1'$2|
    # 单手按键：转换为 _ (左手) 或 + (右手) 开头的一简前缀
    - xform|^([12345qwertasdfgzxcvb]+)$|_$1|
    - xform|^([67890yuiophjkl;nm,./]+)$|+$1|
