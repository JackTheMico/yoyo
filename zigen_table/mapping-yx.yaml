# 音形（yoyo-yx）码表
# 由 generate_yx_mapping.py 从 elements.txt 与 yoyo-yx-char.dict.yaml 反推生成，请勿手改。
#
# 码元 = 声母键（小写）+ 韵母指法（大写），如 vC。字根码元同样是两个字母。
# 声母 24 个 / 韵母 36 个 / 字根 466 个。

# 声母 → 键位
声母:
  a: [n, zh]
  b: [s, 零声母]
  c: [l]
  d: [d, r]
  e: [p, sh]
  f: [y]
  g: [q, z]
  q: [ch, m]
  r: [b]
  s: [h]
  t: [f, x]
  v: [j, k]
  w: [c, w]
  x: [g]
  z: [t]

# 韵母 → 指法
韵母:
  A: [ang, ia, ua, ve]
  B: [en, ie, ng, uo]
  C: [ou, u]
  D: [ao, ian]
  E: [i]
  F: [e, ing]
  G: [a, iang, uai, ue]
  H: [an, in]
  I: [iao, o, ong, un]
  J: [ai, iu, uang]
  K: [eng, er, iong, m, uan, v]
  L: [ei, ui]

# 音形用 1-6 代表六种基本笔画
笔画:
  '1': 一
  '2': 丨
  '3': 丿
  '4': 丶
  '5': 乛
  '6': 乙

